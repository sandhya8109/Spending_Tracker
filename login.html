<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Budget Tracker - Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .gradient-bg {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .input-glow:focus {
      box-shadow: 0 0 20px rgba(102, 126, 234, 0.3);
    }
    .float-animation {
      animation: float 6s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-20px); }
    }
    .fade-in {
      animation: fadeIn 0.8s ease-in-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body class="gradient-bg min-h-screen flex items-center justify-center p-4">
  <!-- Floating background elements -->
  <div class="absolute inset-0 overflow-hidden">
    <div class="absolute top-10 left-10 w-72 h-72 bg-white opacity-10 rounded-full mix-blend-multiply filter blur-xl animate-pulse"></div>
    <div class="absolute top-40 right-10 w-72 h-72 bg-purple-300 opacity-10 rounded-full mix-blend-multiply filter blur-xl animate-pulse delay-1000"></div>
    <div class="absolute -bottom-8 left-20 w-72 h-72 bg-pink-300 opacity-10 rounded-full mix-blend-multiply filter blur-xl animate-pulse delay-500"></div>
  </div>

  <!-- Main Login Container -->
  <div class="relative z-10 w-full max-w-md">
    <!-- Logo/Brand Section -->
    <div class="text-center mb-8 fade-in">
      <div class="float-animation inline-block">
        <div class="w-20 h-20 bg-white bg-opacity-20 rounded-2xl flex items-center justify-center mb-4 mx-auto backdrop-blur-sm">
          <svg class="w-10 h-10 text-white" fill="currentColor" viewBox="0 0 20 20">
            <path d="M4 4a2 2 0 00-2 2v1h16V6a2 2 0 00-2-2H4z"></path>
            <path fill-rule="evenodd" d="M18 9H2v5a2 2 0 002 2h12a2 2 0 002-2V9zM4 13a1 1 0 011-1h1a1 1 0 110 2H5a1 1 0 01-1-1zm5-1a1 1 0 100 2h1a1 1 0 100-2H9z" clip-rule="evenodd"></path>
          </svg>
        </div>
      </div>
      <h1 class="text-3xl font-bold text-white mb-2">Budget Tracker</h1>
      <p class="text-white text-opacity-80">Manage your finances with intelligence</p>
    </div>

    <!-- Login Form -->
    <div class="glass-card rounded-2xl p-8 shadow-2xl fade-in">
      <div class="mb-6 text-center">
        <h2 class="text-2xl font-semibold text-white mb-2">Welcome Back</h2>
        <p class="text-white text-opacity-70">Sign in to your account</p>
      </div>

      <form id="loginForm" class="space-y-6">
        <!-- Username Field -->
        <div class="space-y-2">
          <label for="username" class="block text-sm font-medium text-white">Username</label>
          <div class="relative">
            <input type="text" id="username" name="username" required
                   class="w-full px-4 py-3 bg-white bg-opacity-10 border border-white border-opacity-20 rounded-lg text-white placeholder-white placeholder-opacity-50 focus:outline-none focus:ring-2 focus:ring-white focus:ring-opacity-30 focus:border-transparent input-glow transition-all duration-300"
                   placeholder="Enter your username">
            <div class="absolute inset-y-0 right-3 flex items-center">
              <svg class="w-5 h-5 text-white text-opacity-50" fill="currentColor" viewBox="0 0 20 20">
                <path fill-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" clip-rule="evenodd"></path>
              </svg>
            </div>
          </div>
        </div>

        <!-- Password Field -->
        <div class="space-y-2">
          <label for="password" class="block text-sm font-medium text-white">Password</label>
          <div class="relative">
            <input type="password" id="password" name="password" required
                   class="w-full px-4 py-3 bg-white bg-opacity-10 border border-white border-opacity-20 rounded-lg text-white placeholder-white placeholder-opacity-50 focus:outline-none focus:ring-2 focus:ring-white focus:ring-opacity-30 focus:border-transparent input-glow transition-all duration-300"
                   placeholder="Enter your password">
            <button type="button" id="togglePassword" class="absolute inset-y-0 right-3 flex items-center">
              <svg id="eyeIcon" class="w-5 h-5 text-white text-opacity-50 hover:text-opacity-80 transition-colors" fill="currentColor" viewBox="0 0 20 20">
                <path d="M10 12a2 2 0 100-4 2 2 0 000 4z"></path>
                <path fill-rule="evenodd" d="M.458 10C1.732 5.943 5.522 3 10 3s8.268 2.943 9.542 7c-1.274 4.057-5.064 7-9.542 7S1.732 14.057.458 10zM14 10a4 4 0 11-8 0 4 4 0 018 0z" clip-rule="evenodd"></path>
              </svg>
            </button>
          </div>
        </div>

        <!-- Remember Me & Forgot Password -->
        <div class="flex items-center justify-between">
          <label class="flex items-center">
            <input type="checkbox" id="rememberMe" class="w-4 h-4 text-purple-600 bg-white bg-opacity-10 border-white border-opacity-20 rounded focus:ring-purple-500">
            <span class="ml-2 text-sm text-white text-opacity-80">Remember me</span>
          </label>
          <a href="#" class="text-sm text-white text-opacity-80 hover:text-opacity-100 transition-colors">Forgot password?</a>
        </div>

        <!-- Login Button -->
        <button type="submit" id="loginBtn"
                class="w-full bg-white bg-opacity-20 hover:bg-opacity-30 text-white font-semibold py-3 px-4 rounded-lg transition-all duration-300 focus:outline-none focus:ring-2 focus:ring-white focus:ring-opacity-30 backdrop-blur-sm">
          <span id="loginBtnText">Sign In</span>
          <svg id="loginSpinner" class="hidden animate-spin -ml-1 mr-3 h-5 w-5 text-white inline" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
        </button>
      </form>

      <!-- Demo Credentials -->
      <div class="mt-6 p-4 bg-white bg-opacity-10 rounded-lg">
        <p class="text-white text-opacity-80 text-sm text-center mb-2">Demo Credentials:</p>
        <div class="grid grid-cols-2 gap-4 text-xs">
          <div class="text-center">
            <p class="text-white font-medium">Admin</p>
            <p class="text-white text-opacity-70">admin / admin123</p>
          </div>
          <div class="text-center">
            <p class="text-white font-medium">User</p>
            <p class="text-white text-opacity-70">user / user123</p>
          </div>
        </div>
      </div>

      <!-- Sign Up Link -->
      <div class="mt-6 text-center">
        <p class="text-white text-opacity-70 text-sm">
          Don't have an account? 
          <a href="#" id="signupLink" class="text-white hover:text-opacity-100 transition-colors font-medium">Sign up here</a>
        </p>
      </div>
    </div>
  </div>

  <!-- Notification Container -->
  <div id="notifications" class="fixed top-4 right-4 z-50 space-y-2"></div>

  <script src="js/auth.js"></script>
</body>
</html>
